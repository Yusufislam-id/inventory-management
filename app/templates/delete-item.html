{% extends "base.html" %}

{% block content %}
<div align="center">
    <form action="/deleted" method="post">
        <table border="1" width="500px">
            <tr>
                <th colspan="3">Form Hapus Barang</th>
            </tr>
            <tr>
                <th colspan="3">Masukkan ID Barang</th>
            </tr>
            <tr>
                <td>ID Barang</td><td>:</td><td align="right"><input type="text" name="id" value="{{ data.id }}" readonly/></td>
            </tr>

            <tr>
                <td>Nama Barang</td><td>:</td><td align="right"><input type="text" name="nama" value="{{ data.nama }}" readonly/></td>
            </tr>
            <tr>
                <td>Jumlah Barang</td><td>:</td><td align="right"><input type="number" name="jumlah" value="{{ data.jumlah }}" readonly/></td>
            </tr>
            <tr>
                <td>Deskripsi Barang</td><td>:</td><td align="right"><input type="text" name="deskripsi" value="{{ data.deskripsi }}" readonly/></td>
            </tr>
            <tr>
                <td colspan="3"><input type="submit" value="Hapus"/></td>
            </tr>
        </table>
    </form>
</div>

{% endblock %}
